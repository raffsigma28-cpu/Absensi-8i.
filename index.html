<!DOCTYPE html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1"><title>Absen 8I</title><style>body{font-family:sans-serif;background:#f3f4f6;margin:0;padding:12px}.box{max-width:600px;margin:auto;background:#fff;padding:16px;border-radius:16px}h1{text-align:center}.row{display:flex;gap:8px;margin:10px 0}.row input{flex:1;padding:10px;border:1px solid #ddd;border-radius:8px}button{padding:10px;border-radius:8px;border:0;font-weight:700}table{width:100%;border-collapse:collapse}th{color:#888;font-size:12px;border-bottom:2px solid #eee;text-align:left}td{padding:8px;border-bottom:1px solid #eee}.c{display:flex;gap:6px}.c b{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:2px solid #ddd;border-radius:50%;cursor:pointer}.on-H{background:#dcfce7;border-color:#16a34a}.on-S{background:#fef9c3;border-color:#ca8a04}.on-A{background:#fee2e2;border-color:#dc2626}</style></head><body><div class=box><h1>Absen 8I</h1><div class=row><input type=date id=t><button onclick="dl()" style="background:#16a34a;color:#fff">Excel</button><button onclick="if(confirm('hapus?')){localStorage.clear();location.reload()}" style="background:#fee2e2">Reset</button></div><div class=row><input id=n placeholder="Nama siswa"><button onclick="add()" style="background:#7c3aed;color:#fff">Tambah</button></div><table><tr><th>No</th><th>Nama</th><th>H/S/A</th></tr><tbody id=L></tbody></table></div><script>let S=JSON.parse(localStorage.s||'[]'),A=JSON.parse(localStorage.a||'{}'),t=document.getElementById('t'),L=document.getElementById('L');t.valueAsDate=new Date();function sv(){localStorage.s=JSON.stringify(S);localStorage.a=JSON.stringify(A)}function R(){let d=A[t.value]||{},h='';S.forEach((x,i)=>{let s=d[i]||'';h+=`<tr><td>${i+1}</td><td>${x}</td><td><div class=c><b class=${s=='H'?'on-H':''} onclick="st(${i},'H')">H</b><b class=${s=='S'?'on-S':''} onclick="st(${i},'S')">S</b><b class=${s=='A'?'on-A':''} onclick="st(${i},'A
