<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Absensi Siswa 8I</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:linear-gradient(135deg,#eef2ff,#f8fafc);
  color:#172033;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:850px;
  margin:auto;
  padding:20px;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:white;
  border-radius:24px;
  padding:25px;
  box-shadow:0 15px 35px rgba(37,99,235,.25);
  margin-bottom:18px;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  width:52px;
  height:52px;
  border-radius:16px;
  background:rgba(255,255,255,.2);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:25px;
}

.header h1{
  font-size:25px;
  margin-bottom:4px;
}

.header p{
  opacity:.85;
  font-size:14px;
}

.live{
  margin-top:20px;
  background:rgba(255,255,255,.13);
  padding:14px;
  border-radius:16px;
  text-align:center;
}

#jam{
  font-size:30px;
  font-weight:800;
  letter-spacing:1px;
}

#tanggal{
  margin-top:4px;
  font-size:14px;
}

/* CARD */
.card{
  background:white;
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 8px 25px rgba(15,23,42,.08);
}

.card-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:16px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:13px 0 7px;
}

input,select,textarea{
  width:100%;
  border:1px solid #dbe2ea;
  background:#f8fafc;
  padding:13px 14px;
  border-radius:12px;
  font-size:15px;
  outline:none;
  transition:.2s;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#4f46e5;
  background:white;
  box-shadow:0 0 0 3px rgba(79,70,229,.1);
}

textarea{
  min-height:90px;
  resize:vertical;
}

.btn{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  margin-top:18px;
  color:white;
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 20px rgba(37,99,235,.25);
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* INFO */
.info{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:18px;
}

.info-box{
  background:white;
  border-radius:16px;
  padding:15px;
  box-shadow:0 6px 20px rgba(15,23,42,.06);
}

.info-box small{
  display:block;
  color:#64748b;
  margin-bottom:5px;
}

.info-box strong{
  font-size:21px;
}

/* SEARCH */
.search{
  margin-bottom:15px;
}

/* LIST */
.list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:14px;
  border:1px solid #edf0f5;
  border-radius:14px;
  background:#fafbff;
}

.student{
  min-width:0;
}

.student strong{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.student small{
  color:#64748b;
  display:block;
  margin-top:4px;
}

.right{
  display:flex;
  align-items:center;
  gap:8px;
}

.badge{
  padding:5px 10px;
  border-radius:999px;
  color:white;
  font-size:11px;
  font-weight:800;
}

.hadir{
  background:#16a34a;
}

.sakit{
  background:#f59e0b;
}

.izin{
  background:#6366f1;
}

.alpa{
  background:#ef4444;
}

.empty{
  text-align:center;
  padding:30px 10px;
  color:#64748b;
}

.delete{
  border:0;
  background:#fee2e2;
  color:#dc2626;
  width:32px;
  height:32px;
  border-radius:9px;
  cursor:pointer;
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,120px);
  background:#172033;
  color:white;
  padding:13px 18px;
  border-radius:12px;
  font-size:14px;
  opacity:0;
  transition:.3s;
  z-index:999;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.toast.show{
  transform:translate(-50%,0);
  opacity:1;
}

.toast.success{
  background:#16a34a;
}

.toast.error{
  background:#dc2626;
}

/* FOOTER */
.footer{
  text-align:center;
  color:#64748b;
  font-size:12px;
  padding:10px 0 20px;
}

/* MOBILE */
@media(max-width:600px){

  .container{
    padding:12px;
  }

  .header{
    border-radius:20px;
    padding:20px;
  }

  .header h1{
    font-size:21px;
  }

  .logo{
    width:45px;
    height:45px;
  }

  #jam{
    font-size:26px;
  }

  .info{
    grid-template-columns:1fr 1fr;
  }

  .info-box:last-child{
    grid-column:span 2;
  }

  .row{
    align-items:flex-start;
  }

  .right{
    flex-shrink:0;
  }
}
</style>
</head>
